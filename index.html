<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>LiDAR ПНВ & 3D Сканер Комнаты</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #000; color: #e2e8f0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
  }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }

  /* WebGL холст для XR (на весь экран) */
  #xrGlCanvas {
    position: fixed; inset: 0; width: 100%; height: 100%;
    z-index: 90; display: none; background: #000;
  }
  body.xr-active #xrGlCanvas { display: block; }
  body.xr-active #viewerScreen { display: none; }
  body.xr-active #xrOverlay { display: flex; }

  /* 1. Экран 3D-просмотрщика */
  #viewerScreen {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    background: #03060c; z-index: 5;
  }
  header {
    padding: 10px 12px; display: flex; justify-content: space-between; align-items: center; gap: 6px;
    background: rgba(8, 13, 24, 0.96); border-bottom: 1px solid rgba(34, 197, 94, 0.25);
  }
  .btn-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  button {
    border: 1px solid #334155; background: #111827; color: #f8fafc;
    border-radius: 10px; padding: 8px 11px; font-size: 12px; font-weight: 600;
    cursor: pointer; touch-action: manipulation;
  }
  button:active { transform: scale(0.95); opacity: 0.85; }
  .btn-primary {
    background: #10b981; border-color: #34d399; color: #022c22; font-weight: 700;
  }
  .btn-green {
    background: rgba(16, 185, 129, 0.18); border-color: #10b981; color: #6ee7b7;
  }
  .btn-active {
    background: rgba(34, 197, 94, 0.32) !important;
    border-color: #4ade80 !important; color: #fff !important;
  }

  #viewportWrap {
    position: relative; flex: 1; width: 100%; overflow: hidden; touch-action: none;
  }
  #viewGlCanvas { width: 100%; height: 100%; display: block; }

  #emptyHint {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 8px;
    pointer-events: none; color: #64748b; font-size: 14px; text-align: center; padding: 24px;
  }

  footer {
    padding: 10px 12px 18px; display: flex; flex-direction: column; gap: 8px;
    background: rgba(8, 13, 24, 0.96); border-top: 1px solid rgba(34, 197, 94, 0.2);
  }
  .footer-row {
    display: flex; justify-content: space-between; align-items: center; gap: 8px;
  }

  /* 2. Полноэкранный HUD поверх WebGL XR */
  #xrOverlay {
    position: fixed; inset: 0; z-index: 100;
    display: none; flex-direction: column; justify-content: space-between;
    pointer-events: none; background: transparent;
  }
  .xr-top {
    padding: 12px; display: flex; justify-content: space-between; align-items: flex-start; gap: 8px;
    pointer-events: auto;
  }
  .xr-left-col { display: flex; flex-direction: column; gap: 6px; }
  #xrMetaPill {
    font-size: 11px; color: #86efac;
    background: rgba(0, 18, 6, 0.82); border: 1px solid rgba(74, 222, 128, 0.35);
    padding: 4px 8px; border-radius: 8px; align-self: flex-start;
  }

  #miniMapCanvas {
    position: fixed; top: 62px; right: 12px; z-index: 102;
    width: 112px; height: 112px;
    background: rgba(0, 12, 4, 0.85);
    border: 1px solid rgba(74, 222, 128, 0.45);
    border-radius: 12px; pointer-events: none;
  }

  .xr-reticle {
    align-self: center; pointer-events: none;
    display: flex; flex-direction: column; align-items: center; gap: 5px;
  }
  .reticle-ring {
    width: 34px; height: 34px; border-radius: 50%;
    border: 1.5px solid rgba(74, 222, 128, 0.65);
    display: flex; align-items: center; justify-content: center;
  }
  .reticle-dot { width: 4px; height: 4px; border-radius: 50%; background: #4ade80; }
  #xrDist {
    font-size: 12px; font-weight: 700; color: #4ade80;
    background: rgba(0, 18, 0, 0.82); padding: 2px 8px; border-radius: 6px;
    border: 1px solid rgba(74, 222, 128, 0.35);
  }

  .xr-bottom {
    padding: 10px 12px 24px; pointer-events: auto;
    background: linear-gradient(to top, rgba(0,0,0,0.92), rgba(0,0,0,0.45), transparent);
    display: flex; flex-direction: column; gap: 9px;
  }
  .slider-row {
    display: flex; align-items: center; gap: 10px; font-size: 12px; color: #86efac;
  }
  input[type="range"] {
    flex: 1; height: 6px; border-radius: 99px; background: #14532d;
    outline: none; -webkit-appearance: none;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 20px; height: 20px;
    border-radius: 50%; background: #4ade80; cursor: pointer;
  }
  .xr-actions {
    display: flex; justify-content: space-between; align-items: center; gap: 6px;
  }
</style>
</head>
<body>

  <!-- WebGL холст для XR (настоящий 3D-рендер на GPU с Depth Buffer) -->
  <canvas id="xrGlCanvas"></canvas>

  <!-- 1. Экран 3D-просмотра комнаты -->
  <div id="viewerScreen">
    <header>
      <div class="btn-row">
        <button type="button" id="btnStartNV" class="btn-primary">👁 ПНВ LiDAR</button>
        <button type="button" id="btnStartRoom" class="btn-green">🏠 Скан комнаты</button>
      </div>
      <div class="btn-row">
        <button type="button" id="btnTopView">🗺 План</button>
        <button type="button" id="btnResetView">🎯</button>
        <button type="button" id="btnClearAll">🗑</button>
      </div>
    </header>

    <div id="viewportWrap">
      <canvas id="viewGlCanvas"></canvas>
      <div id="emptyHint">
        <div style="font-size:15px; color:#cbd5e1; font-weight:600;">LiDAR ПНВ & 3D Сканер</div>
        <div>Нажмите «👁 ПНВ LiDAR» или «🏠 Скан комнаты»<br>в браузере XRViewer</div>
      </div>
    </div>

    <footer class="mono">
      <div class="slider-row">
        <span>Срез потолка:</span>
        <input type="range" id="sliderClipY" min="-0.5" max="3.5" step="0.1" value="3.5">
        <strong id="clipYVal" style="width:44px; text-align:right;">Выкл</strong>
      </div>
      <div class="footer-row">
        <div class="btn-row">
          <button type="button" id="btnViewModeNV">ПНВ</button>
          <button type="button" id="btnViewModeTherm">Тепло</button>
          <button type="button" id="btnViewModeRoom" class="btn-active">Высота</button>
        </div>
        <div class="btn-row">
          <button type="button" id="btnExportOBJ">.OBJ</button>
          <button type="button" id="btnExportPLY">.PLY</button>
        </div>
      </div>
    </footer>
  </div>

  <!-- 2. HUD поверх WebGL XR -->
  <div id="xrOverlay">
    <canvas id="miniMapCanvas" width="112" height="112"></canvas>

    <div class="xr-top">
      <div class="xr-left-col">
        <div class="btn-row">
          <button type="button" id="btnXrPalNV" class="btn-active">👁 ПНВ</button>
          <button type="button" id="btnXrPalTherm">🔥 Тепло</button>
          <button type="button" id="btnXrPalRoom">🏠 Комната</button>
        </div>
        <div id="xrMetaPill" class="mono">Точек: 0 | IMU: —</div>
      </div>
      <button type="button" id="btnExitXR" style="background:#7f1d1d; border-color:#ef4444;">Готово</button>
    </div>

    <div class="xr-reticle mono">
      <div class="reticle-ring"><div class="reticle-dot"></div></div>
      <div id="xrDist">— м</div>
    </div>

    <div class="xr-bottom mono">
      <div class="slider-row">
        <span>Дальность:</span>
        <input type="range" id="sliderRange" min="0.8" max="8.0" step="0.2" value="5.0">
        <strong id="rangeVal" style="width:44px; text-align:right;">5.0 м</strong>
      </div>
      <div class="xr-actions">
        <button type="button" id="btnPause">⏸ Пауза</button>
        <button type="button" id="btnSonar" class="btn-active">🌊 Сонар</button>
        <button type="button" id="btnBgMode">📷 Чёрный</button>
        <button type="button" id="btnClearXR">🗑</button>
      </div>
    </div>
  </div>

<script>
(function() {
  // =========================================================
  // 1. КОНСТАНТЫ И БУФЕРЫ ОБЛАКА ТОЧЕК (ДО 100 000 ВОКСЕЛЕЙ НА GPU)
  // =========================================================
  const MAX_POINTS = 100000;
  const VOXEL_SIZE = 0.035; // 3.5 см — чёткие стены, дверные проёмы и мебель

  // Interleaved буфер для GPU: [x, y, z] (3 float на точку)
  const gpuPositions = new Float32Array(MAX_POINTS * 3);
  const voxelMap = new Map(); // key -> { idx, hits }

  const state = {
    pointCount: 0,
    uploadedCount: 0,
    xrSession: null,
    isPaused: false,
    showCameraBg: false, // Строго чёрный фон по умолчанию
    sonarEnabled: true,
    colorMode: 0,        // 0 = ПНВ (дистанция), 1 = Тепловизор, 2 = Высота (комната)
    viewColorMode: 2,
    maxRange: 5.0,
    clipY: 3.5,
    // IMU (Гироскоп + Акселерометр)
    imuOk: false,
    rotSpeed: 0,         // deg/s — защита от смаза при резком рывке
    lastCamPos: null,
    trackingWarn: false,
    // 3D просмотрщик
    yaw: 0.5,
    pitch: 0.45,
    zoom: 4.5,
    centerX: 0,
    centerY: 0,
    centerZ: 0
  };

  // =========================================================
  // 2. GLSL ШЕЙДЕРЫ (АППАРАТНЫЙ DEPTH BUFFER + GLOW + СОНАР)
  // =========================================================
  const VS_SRC = `
    attribute vec3 aPos;
    uniform mat4 uView;
    uniform mat4 uProj;
    uniform vec3 uCamPos;
    uniform float uMaxRange;
    uniform float uClipY;
    uniform float uPointScale;
    uniform int uColorMode;
    uniform float uSonarR;
    uniform float uSonarOn;
    varying vec3 vColor;
    varying float vAlpha;

    void main() {
      if (aPos.y > uClipY) {
        gl_Position = vec4(2.0, 2.0, 2.0, 1.0);
        gl_PointSize = 0.0;
        vAlpha = 0.0;
        return;
      }

      float dist = length(aPos - uCamPos);
      if (dist > uMaxRange) {
        gl_Position = vec4(2.0, 2.0, 2.0, 1.0);
        gl_PointSize = 0.0;
        vAlpha = 0.0;
        return;
      }

      vec4 viewPos = uView * vec4(aPos, 1.0);
      gl_Position = uProj * viewPos;

      float depth = max(0.25, -viewPos.z);
      gl_PointSize = clamp(uPointScale / depth, 2.5, 16.0);

      float near = clamp(1.0 - dist / uMaxRange, 0.0, 1.0);
      vec3 col;

      if (uColorMode == 0) {
        // ПНВ (Night Vision): близко = яркий бело-зелёный, средне = изумруд, далеко = тёмно-зелёный
        col = mix(vec3(0.02, 0.28, 0.08), vec3(0.25, 1.0, 0.45), pow(near, 1.15));
        if (near > 0.78) {
          col = mix(col, vec3(0.82, 1.0, 0.88), (near - 0.78) / 0.22);
        }
      } else if (uColorMode == 1) {
        // Тепловизор по дистанции: близко = красный/жёлтый, средне = зелёный/циан, далеко = синий
        float t = 1.0 - near;
        vec3 c0 = vec3(1.0, 0.18, 0.12);
        vec3 c1 = vec3(1.0, 0.82, 0.10);
        vec3 c2 = vec3(0.10, 0.92, 0.55);
        vec3 c3 = vec3(0.08, 0.35, 0.95);
        if (t < 0.33) col = mix(c0, c1, t / 0.33);
        else if (t < 0.66) col = mix(c1, c2, (t - 0.33) / 0.33);
        else col = mix(c2, c3, (t - 0.66) / 0.34);
      } else {
        // Комната по высоте (пол = сине-голубой, стены = бирюзово-зелёный, верх = янтарь)
        float h = clamp((aPos.y + 1.35) / 2.6, 0.0, 1.0);
        vec3 floorCol = vec3(0.10, 0.55, 0.95);
        vec3 wallCol  = vec3(0.12, 0.92, 0.62);
        vec3 ceilCol  = vec3(0.98, 0.68, 0.18);
        col = h < 0.5 ? mix(floorCol, wallCol, h * 2.0) : mix(wallCol, ceilCol, (h - 0.5) * 2.0);
        col *= (0.45 + 0.55 * near);
      }

      // Импульс сонара (волна от телефона)
      if (uSonarOn > 0.5) {
        float wave = 1.0 - smoothstep(0.0, 0.22, abs(dist - uSonarR));
        col += vec3(0.35, 0.85, 0.55) * wave * 0.75;
        gl_PointSize += wave * 3.5;
      }

      vColor = col;
      vAlpha = 0.35 + 0.65 * near;
    }
  `;

  const FS_SRC = `
    precision mediump float;
    varying vec3 vColor;
    varying float vAlpha;

    void main() {
      vec2 p = gl_PointCoord - vec2(0.5);
      float r2 = dot(p, p);
      if (r2 > 0.25) discard;
      float soft = 1.0 - smoothstep(0.08, 0.25, r2);
      gl_FragColor = vec4(vColor, vAlpha * soft);
    }
  `;

  function createGLContext(canvas, xrCompat) {
    const gl = canvas.getContext('webgl', {
      alpha: true,
      antialias: true,
      depth: true,
      preserveDrawingBuffer: false,
      xrCompatible: !!xrCompat
    });
    if (!gl) return null;

    function compile(type, src) {
      const s = gl.createShader(type);
      gl.shaderSource(s, src);
      gl.compileShader(s);
      return s;
    }

    const prog = gl.createProgram();
    gl.attachShader(prog, compile(gl.VERTEX_SHADER, VS_SRC));
    gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, FS_SRC));
    gl.linkProgram(prog);

    const posBuf = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, posBuf);
    gl.bufferData(gl.ARRAY_BUFFER, gpuPositions.byteLength, gl.DYNAMIC_DRAW);

    return {
      gl,
      prog,
      posBuf,
      uploaded: 0,
      locPos: gl.getAttribLocation(prog, 'aPos'),
      uView: gl.getUniformLocation(prog, 'uView'),
      uProj: gl.getUniformLocation(prog, 'uProj'),
      uCamPos: gl.getUniformLocation(prog, 'uCamPos'),
      uMaxRange: gl.getUniformLocation(prog, 'uMaxRange'),
      uClipY: gl.getUniformLocation(prog, 'uClipY'),
      uPointScale: gl.getUniformLocation(prog, 'uPointScale'),
      uColorMode: gl.getUniformLocation(prog, 'uColorMode'),
      uSonarR: gl.getUniformLocation(prog, 'uSonarR'),
      uSonarOn: gl.getUniformLocation(prog, 'uSonarOn')
    };
  }

  function syncGPU(ctxObj) {
    if (!ctxObj) return;
    const { gl, posBuf } = ctxObj;
    if (state.pointCount < ctxObj.uploaded) {
      ctxObj.uploaded = 0;
    }
    if (state.pointCount > ctxObj.uploaded) {
      gl.bindBuffer(gl.ARRAY_BUFFER, posBuf);
      const start = ctxObj.uploaded * 3;
      const sub = gpuPositions.subarray(start, state.pointCount * 3);
      gl.bufferSubData(gl.ARRAY_BUFFER, start * 4, sub);
      ctxObj.uploaded = state.pointCount;
    }
  }

  // =========================================================
  // 3. IMU ДАТЧИКИ (ГИРОСКОП + АКСЕЛЕРОМЕТР)
  // =========================================================
  function onMotion(e) {
    const rr = e.rotationRate;
    if (rr && rr.alpha !== null) {
      state.rotSpeed = Math.hypot(rr.alpha || 0, rr.beta || 0, rr.gamma || 0);
      state.imuOk = true;
    }
  }

  async function initIMU() {
    try {
      if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
        const res = await DeviceMotionEvent.requestPermission().catch(() => 'denied');
        if (res === 'granted') window.addEventListener('devicemotion', onMotion, true);
      } else {
        window.addEventListener('devicemotion', onMotion, true);
      }
    } catch (e) {}
  }

  // =========================================================
  // 4. ВЕЕР ИЗ 25 ЛУЧЕЙ LIDAR + ПРОСТРАНСТВЕННЫЙ ВОКСЕЛЬНЫЙ ФИЛЬТР
  // =========================================================
  const rayGrid = [];
  for (let gy = -2; gy <= 2; gy++) {
    for (let gx = -2; gx <= 2; gx++) {
      const rx = gx * 0.20;
      const ry = gy * 0.25;
      const len = Math.hypot(rx, ry, -1);
      rayGrid.push({
        dx: rx / len,
        dy: ry / len,
        dz: -1 / len,
        rawX: rx,
        rawY: ry,
        isCenter: (gx === 0 && gy === 0)
      });
    }
  }

  function addVoxelPoint(hx, hy, hz, dist) {
    if (state.isPaused) return;
    if (dist < 0.15 || dist > state.maxRange) return;
    // Защита от смаза при слишком резком рывке телефона (> 170°/сек)
    if (state.imuOk && state.rotSpeed > 170) return;

    const vx = Math.floor(hx / VOXEL_SIZE);
    const vy = Math.floor(hy / VOXEL_SIZE);
    const vz = Math.floor(hz / VOXEL_SIZE);
    const key = vx + ',' + vy + ',' + vz;

    let entry = voxelMap.get(key);
    if (!entry) {
      // Первый хит — сохраняем кандидата; при втором хите в ту же ячейку точка фиксируется (убирает летучий шум!)
      voxelMap.set(key, { idx: -1, hits: 1, x: hx, y: hy, z: hz });
    } else {
      entry.hits++;
      entry.x = entry.x * 0.7 + hx * 0.3;
      entry.y = entry.y * 0.7 + hy * 0.3;
      entry.z = entry.z * 0.7 + hz * 0.3;

      if (entry.idx === -1 && entry.hits >= 2 && state.pointCount < MAX_POINTS) {
        const id = state.pointCount++;
        entry.idx = id;
        gpuPositions[id * 3] = entry.x;
        gpuPositions[id * 3 + 1] = entry.y;
        gpuPositions[id * 3 + 2] = entry.z;
      } else if (entry.idx >= 0) {
        const id = entry.idx;
        gpuPositions[id * 3] = entry.x;
        gpuPositions[id * 3 + 1] = entry.y;
        gpuPositions[id * 3 + 2] = entry.z;
      }
    }
  }

  // =========================================================
  // 5. WEBXR СЕССИЯ (GPU РЕНДЕР + ГАРАНТИРОВАННЫЙ ЧЁРНЫЙ ФОН)
  // =========================================================
  const xrCanvas = document.getElementById('xrGlCanvas');
  const xrMetaPill = document.getElementById('xrMetaPill');
  const xrDistEl = document.getElementById('xrDist');
  const miniMap = document.getElementById('miniMapCanvas');
  const mCtx = miniMap.getContext('2d');
  const emptyHint = document.getElementById('emptyHint');

  let xrCtxObj = null;
  let refSpace = null;
  let hitSources = [];
  let legacyIdx = 0;

  async function startXR(paletteMode) {
    if (!navigator.xr) {
      alert('WebXR не найден. Откройте файл в XRViewer.');
      return;
    }

    await initIMU();
    state.colorMode = paletteMode;
    state.isPaused = false;
    state.lastCamPos = null;
    updateXrPaletteButtons();
    document.getElementById('btnPause').textContent = '⏸ Пауза';

    try {
      let session;
      try {
        session = await navigator.xr.requestSession('immersive-ar', {
          optionalFeatures: ['hit-test', 'dom-overlay'],
          domOverlay: { root: document.getElementById('xrOverlay') }
        });
      } catch {
        session = await navigator.xr.requestSession('immersive-ar', {
          optionalFeatures: ['hit-test']
        });
      }

      state.xrSession = session;
      document.body.classList.add('xr-active');
      applyBgStyle();

      if (!xrCtxObj) {
        xrCtxObj = createGLContext(xrCanvas, true);
      }
      if (xrCtxObj && typeof XRWebGLLayer !== 'undefined') {
        session.updateRenderState({ baseLayer: new XRWebGLLayer(session, xrCtxObj.gl) });
      }

      refSpace = await session.requestReferenceSpace('local')
        .catch(() => session.requestReferenceSpace('viewer'));
      const viewerSpace = await session.requestReferenceSpace('viewer').catch(() => null);

      // Инициализируем 25 лучей
      hitSources = [];
      if (viewerSpace && session.requestHitTestSource) {
        const hasXRRay = (typeof XRRay !== 'undefined');
        for (let i = 0; i < rayGrid.length; i++) {
          const r = rayGrid[i];
          try {
            let opts = { space: viewerSpace };
            if (hasXRRay && !r.isCenter) {
              opts.offsetRay = new XRRay({ x: 0, y: 0, z: 0 }, { x: r.dx, y: r.dy, z: r.dz });
            } else if (!hasXRRay && !r.isCenter) {
              continue;
            }
            const src = await session.requestHitTestSource(opts);
            hitSources.push({ src, isCenter: r.isCenter });
          } catch {
            if (r.isCenter) {
              const src = await session.requestHitTestSource({ space: viewerSpace }).catch(() => null);
              if (src) hitSources.push({ src, isCenter: true });
            }
          }
        }
      }

      session.addEventListener('end', () => {
        state.xrSession = null;
        hitSources = [];
        document.body.classList.remove('xr-active');
        if (state.pointCount > 0) {
          computeCenter();
          emptyHint.style.display = 'none';
          if (viewCtxObj) viewCtxObj.uploaded = 0; // Полный синк в просмотрщик
        }
      });

      session.requestAnimationFrame(onXRFrame);
    } catch (e) {
      alert('Ошибка AR: ' + e.message);
    }
  }

  function onXRFrame(now, frame) {
    const session = state.xrSession;
    if (!session || !xrCtxObj) return;
    session.requestAnimationFrame(onXRFrame);

    const { gl } = xrCtxObj;
    const baseLayer = session.renderState.baseLayer;
    if (baseLayer) {
      gl.bindFramebuffer(gl.FRAMEBUFFER, baseLayer.framebuffer);
      gl.viewport(0, 0, baseLayer.framebufferWidth, baseLayer.framebufferHeight);
    }

    // Гарантированный чёрный или прозрачный фон в WebGL
    gl.clearColor(0.0, 0.0, 0.0, state.showCameraBg ? 0.0 : 1.0);
    gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);

    const pose = frame.getViewerPose(refSpace);
    if (!pose || !pose.views || pose.views.length === 0) {
      state.trackingWarn = true;
      updateMetaPill();
      return;
    }

    const cam = pose.transform.position;
    const view = pose.views[0];

    // Защита от резкого скачка позиции ARKit
    let jumped = false;
    if (state.lastCamPos) {
      const step = Math.hypot(cam.x - state.lastCamPos.x, cam.y - state.lastCamPos.y, cam.z - state.lastCamPos.z);
      if (step > 0.40) jumped = true;
    }
    state.lastCamPos = { x: cam.x, y: cam.y, z: cam.z };
    state.trackingWarn = jumped;

    if (!jumped) {
      // A) 25 лучей через WebXR HitTestSource
      for (let i = 0; i < hitSources.length; i++) {
        const item = hitSources[i];
        try {
          const res = frame.getHitTestResults(item.src);
          if (res.length > 0) {
            const hp = res[0].getPose(refSpace).transform.position;
            const d = Math.hypot(hp.x - cam.x, hp.y - cam.y, hp.z - cam.z);
            if (item.isCenter) xrDistEl.textContent = d.toFixed(2) + ' м';
            addVoxelPoint(hp.x, hp.y, hp.z, d);
          }
        } catch {}
      }

      // B) 10 лучей за кадр через Mozilla XRViewer requestHitTest
      if (hitSources.length <= 1 && typeof session.requestHitTest === 'function') {
        const m = view.transform.matrix;
        const origin = new Float32Array([cam.x, cam.y, cam.z]);

        for (let k = 0; k < 10; k++) {
          const r = rayGrid[legacyIdx % rayGrid.length];
          legacyIdx++;
          const wx = m[0] * r.rawX + m[4] * r.rawY - m[8];
          const wy = m[1] * r.rawX + m[5] * r.rawY - m[9];
          const wz = m[2] * r.rawX + m[6] * r.rawY - m[10];
          const len = Math.hypot(wx, wy, wz) || 1;
          const dir = new Float32Array([wx / len, wy / len, wz / len]);

          session.requestHitTest(origin, dir, refSpace).then(hits => {
            if (hits && hits.length > 0 && hits[0].hitMatrix) {
              const hm = hits[0].hitMatrix;
              const hx = hm[12], hy = hm[13], hz = hm[14];
              const d = Math.hypot(hx - cam.x, hy - cam.y, hz - cam.z);
              if (r.isCenter) xrDistEl.textContent = d.toFixed(2) + ' м';
              addVoxelPoint(hx, hy, hz, d);
            }
          }).catch(() => {});
        }
      }
    }

    // Загружаем только новые точки на GPU и рисуем ВСЮ комнату за 1 вызов (60 FPS!)
    syncGPU(xrCtxObj);
    if (state.pointCount > 0) {
      gl.enable(gl.DEPTH_TEST);
      gl.enable(gl.BLEND);
      gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);

      gl.useProgram(xrCtxObj.prog);
      gl.bindBuffer(gl.ARRAY_BUFFER, xrCtxObj.posBuf);
      gl.enableVertexAttribArray(xrCtxObj.locPos);
      gl.vertexAttribPointer(xrCtxObj.locPos, 3, gl.FLOAT, false, 0, 0);

      gl.uniformMatrix4fv(xrCtxObj.uView, false, view.transform.inverse.matrix);
      gl.uniformMatrix4fv(xrCtxObj.uProj, false, view.projectionMatrix);
      gl.uniform3f(xrCtxObj.uCamPos, cam.x, cam.y, cam.z);
      gl.uniform1f(xrCtxObj.uMaxRange, state.maxRange);
      gl.uniform1f(xrCtxObj.uClipY, 99.0);
      gl.uniform1f(xrCtxObj.uPointScale, 20.0);
      gl.uniform1i(xrCtxObj.uColorMode, state.colorMode);

      const sonarR = ((now * 0.0018) % (state.maxRange + 0.5));
      gl.uniform1f(xrCtxObj.uSonarR, sonarR);
      gl.uniform1f(xrCtxObj.uSonarOn, state.sonarEnabled ? 1.0 : 0.0);

      gl.drawArrays(gl.POINTS, 0, state.pointCount);
    }

    updateMetaPill();
    drawMiniMap(cam, view.transform.matrix);
  }

  function updateMetaPill() {
    const imu = state.imuOk ? 'IMU OK' : 'IMU —';
    const warn = state.trackingWarn ? ' | ⚠ Трекинг' : '';
    xrMetaPill.textContent = 'Точек: ' + state.pointCount.toLocaleString('ru-RU') + ' | ' + imu + warn;
    xrMetaPill.style.color = state.trackingWarn ? '#fb7185' : '#86efac';
  }

  function drawMiniMap(cam, camMat) {
    const w = 112, h = 112, cx = 56, cy = 56, scale = 12;
    mCtx.clearRect(0, 0, w, h);

    mCtx.strokeStyle = 'rgba(74, 222, 128, 0.14)';
    mCtx.lineWidth = 1;
    mCtx.beginPath();
    mCtx.moveTo(cx, 0); mCtx.lineTo(cx, h);
    mCtx.moveTo(0, cy); mCtx.lineTo(w, cy);
    mCtx.stroke();

    const step = state.pointCount > 3500 ? Math.floor(state.pointCount / 3500) : 1;
    mCtx.fillStyle = '#4ade80';
    for (let i = 0; i < state.pointCount; i += step) {
      const mx = cx + (gpuPositions[i * 3] - cam.x) * scale;
      const mz = cy + (gpuPositions[i * 3 + 2] - cam.z) * scale;
      if (mx >= 0 && mx < w && mz >= 0 && mz < h) {
        mCtx.fillRect(mx, mz, 2, 2);
      }
    }

    const fx = -camMat[8], fz = -camMat[10];
    const fl = Math.hypot(fx, fz) || 1;
    mCtx.strokeStyle = '#fff';
    mCtx.lineWidth = 2;
    mCtx.beginPath();
    mCtx.moveTo(cx, cy);
    mCtx.lineTo(cx + (fx / fl) * 12, cy + (fz / fl) * 12);
    mCtx.stroke();

    mCtx.fillStyle = '#fff';
    mCtx.beginPath();
    mCtx.arc(cx, cy, 3, 0, Math.PI * 2);
    mCtx.fill();
  }

  // =========================================================
  // 6. 3D WEBGL ПРОСМОТРЩИК КОМНАТЫ (ПОСЛЕ НАЖАТИЯ «ГОТОВО»)
  // =========================================================
  const viewCanvas = document.getElementById('viewGlCanvas');
  const viewCtxObj = createGLContext(viewCanvas, false);

  function computeCenter() {
    if (state.pointCount === 0) return;
    let cx = 0, cy = 0, cz = 0;
    for (let i = 0; i < state.pointCount; i++) {
      cx += gpuPositions[i * 3];
      cy += gpuPositions[i * 3 + 1];
      cz += gpuPositions[i * 3 + 2];
    }
    state.centerX = cx / state.pointCount;
    state.centerY = cy / state.pointCount;
    state.centerZ = cz / state.pointCount;
  }

  function makePerspective(fovRad, aspect, near, far) {
    const f = 1.0 / Math.tan(fovRad / 2);
    const nf = 1 / (near - far);
    return new Float32Array([
      f / aspect, 0, 0, 0,
      0, f, 0, 0,
      0, 0, (far + near) * nf, -1,
      0, 0, (2 * far * near) * nf, 0
    ]);
  }

  function makeLookAt(ex, ey, ez, tx, ty, tz) {
    let zx = ex - tx, zy = ey - ty, zz = ez - tz;
    let zl = Math.hypot(zx, zy, zz) || 1;
    zx /= zl; zy /= zl; zz /= zl;
    let xx = zz, xy = 0, xz = -zx;
    let xl = Math.hypot(xx, xy, xz) || 1;
    xx /= xl; xy /= xl; xz /= xl;
    const yx = zy * xz - zz * xy;
    const yy = zz * xx - zx * xz;
    const yz = zx * xy - zy * xx;
    return new Float32Array([
      xx, yx, zx, 0,
      xy, yy, zy, 0,
      xz, yz, zz, 0,
      -(xx * ex + xy * ey + xz * ez),
      -(yx * ex + yy * ey + yz * ez),
      -(zx * ex + zy * ey + zz * ez),
      1
    ]);
  }

  function render3DViewer(now) {
    requestAnimationFrame(render3DViewer);
    if (state.xrSession || !viewCtxObj) return;

    const wrap = document.getElementById('viewportWrap');
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const w = Math.floor((wrap.clientWidth || 360) * dpr);
    const h = Math.floor((wrap.clientHeight || 500) * dpr);
    if (viewCanvas.width !== w || viewCanvas.height !== h) {
      viewCanvas.width = w; viewCanvas.height = h;
    }

    const { gl } = viewCtxObj;
    gl.viewport(0, 0, w, h);
    gl.clearColor(0.015, 0.025, 0.05, 1.0);
    gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);

    if (state.pointCount === 0) return;

    syncGPU(viewCtxObj);

    const ex = state.centerX + Math.sin(state.yaw) * Math.cos(state.pitch) * state.zoom;
    const ey = state.centerY + Math.sin(state.pitch) * state.zoom;
    const ez = state.centerZ + Math.cos(state.yaw) * Math.cos(state.pitch) * state.zoom;

    const viewMat = makeLookAt(ex, ey, ez, state.centerX, state.centerY, state.centerZ);
    const projMat = makePerspective(52 * Math.PI / 180, w / h, 0.05, 50.0);

    gl.enable(gl.DEPTH_TEST);
    gl.enable(gl.BLEND);
    gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);

    gl.useProgram(viewCtxObj.prog);
    gl.bindBuffer(gl.ARRAY_BUFFER, viewCtxObj.posBuf);
    gl.enableVertexAttribArray(viewCtxObj.locPos);
    gl.vertexAttribPointer(viewCtxObj.locPos, 3, gl.FLOAT, false, 0, 0);

    gl.uniformMatrix4fv(viewCtxObj.uView, false, viewMat);
    gl.uniformMatrix4fv(viewCtxObj.uProj, false, projMat);
    gl.uniform3f(viewCtxObj.uCamPos, ex, ey, ez);
    gl.uniform1f(viewCtxObj.uMaxRange, 25.0);
    gl.uniform1f(viewCtxObj.uClipY, state.clipY >= 3.45 ? 99.0 : (state.centerY + state.clipY));
    gl.uniform1f(viewCtxObj.uPointScale, 24.0 * dpr);
    gl.uniform1i(viewCtxObj.uColorMode, state.viewColorMode);
    gl.uniform1f(viewCtxObj.uSonarR, 0.0);
    gl.uniform1f(viewCtxObj.uSonarOn, 0.0);

    gl.drawArrays(gl.POINTS, 0, state.pointCount);
  }
  requestAnimationFrame(render3DViewer);

  // Вращение 1 пальцем + Зум 2 пальцами
  const ptrs = new Map();
  let lastPinch = null, lastOne = null;
  const wrap = document.getElementById('viewportWrap');

  wrap.addEventListener('pointerdown', e => {
    ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (ptrs.size === 1) { lastOne = { x: e.clientX, y: e.clientY }; lastPinch = null; }
  });
  wrap.addEventListener('pointermove', e => {
    if (!ptrs.has(e.pointerId)) return;
    ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (ptrs.size === 1 && lastOne) {
      state.yaw -= (e.clientX - lastOne.x) * 0.008;
      state.pitch = Math.max(-1.52, Math.min(1.52, state.pitch + (e.clientY - lastOne.y) * 0.008));
      lastOne = { x: e.clientX, y: e.clientY };
    } else if (ptrs.size === 2) {
      const a = Array.from(ptrs.values());
      const d = Math.hypot(a[0].x - a[1].x, a[0].y - a[1].y);
      if (lastPinch !== null) state.zoom = Math.max(0.6, Math.min(16, state.zoom - (d - lastPinch) * 0.015));
      lastPinch = d;
    }
  });
  function dropPtr(e) {
    ptrs.delete(e.pointerId);
    if (ptrs.size < 2) lastPinch = null;
    if (ptrs.size === 1) { const p = Array.from(ptrs.values())[0]; lastOne = { x: p.x, y: p.y }; }
    else lastOne = null;
  }
  wrap.addEventListener('pointerup', dropPtr);
  wrap.addEventListener('pointercancel', dropPtr);

  // =========================================================
  // 7. ЭКСПОРТ И УПРАВЛЕНИЕ КНОПКАМИ
  // =========================================================
  const NL = String.fromCharCode(10);
  function download(text, name) {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([text], { type: 'text/plain' }));
    a.download = name;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
  }

  document.getElementById('btnExportOBJ').onclick = () => {
    if (state.pointCount === 0) return;
    const lines = ['# LiDAR Room Scan'];
    for (let i = 0; i < state.pointCount; i++) {
      lines.push('v ' + gpuPositions[i * 3].toFixed(4) + ' ' + gpuPositions[i * 3 + 1].toFixed(4) + ' ' + gpuPositions[i * 3 + 2].toFixed(4));
    }
    download(lines.join(NL), 'room-lidar-' + Date.now() + '.obj');
  };

  document.getElementById('btnExportPLY').onclick = () => {
    if (state.pointCount === 0) return;
    const lines = [
      'ply', 'format ascii 1.0', 'element vertex ' + state.pointCount,
      'property float x', 'property float y', 'property float z', 'end_header'
    ];
    for (let i = 0; i < state.pointCount; i++) {
      lines.push(gpuPositions[i * 3].toFixed(4) + ' ' + gpuPositions[i * 3 + 1].toFixed(4) + ' ' + gpuPositions[i * 3 + 2].toFixed(4));
    }
    download(lines.join(NL), 'room-lidar-' + Date.now() + '.ply');
  };

  function clearPoints() {
    state.pointCount = 0;
    voxelMap.clear();
    if (xrCtxObj) xrCtxObj.uploaded = 0;
    if (viewCtxObj) viewCtxObj.uploaded = 0;
    emptyHint.style.display = 'flex';
  }

  function applyBgStyle() {
    xrCanvas.style.background = state.showCameraBg ? 'transparent' : '#000000';
    document.getElementById('btnBgMode').textContent = state.showCameraBg ? '📷 Камера' : '📷 Чёрный';
  }

  function updateXrPaletteButtons() {
    document.getElementById('btnXrPalNV').classList.toggle('btn-active', state.colorMode === 0);
    document.getElementById('btnXrPalTherm').classList.toggle('btn-active', state.colorMode === 1);
    document.getElementById('btnXrPalRoom').classList.toggle('btn-active', state.colorMode === 2);
  }

  function updateViewPaletteButtons() {
    document.getElementById('btnViewModeNV').classList.toggle('btn-active', state.viewColorMode === 0);
    document.getElementById('btnViewModeTherm').classList.toggle('btn-active', state.viewColorMode === 1);
    document.getElementById('btnViewModeRoom').classList.toggle('btn-active', state.viewColorMode === 2);
  }

  document.getElementById('btnStartNV').onclick = () => startXR(0);
  document.getElementById('btnStartRoom').onclick = () => startXR(2);
  document.getElementById('btnExitXR').onclick = () => { if (state.xrSession) state.xrSession.end(); };

  document.getElementById('btnXrPalNV').onclick = () => { state.colorMode = 0; updateXrPaletteButtons(); };
  document.getElementById('btnXrPalTherm').onclick = () => { state.colorMode = 1; updateXrPaletteButtons(); };
  document.getElementById('btnXrPalRoom').onclick = () => { state.colorMode = 2; updateXrPaletteButtons(); };

  document.getElementById('btnViewModeNV').onclick = () => { state.viewColorMode = 0; updateViewPaletteButtons(); };
  document.getElementById('btnViewModeTherm').onclick = () => { state.viewColorMode = 1; updateViewPaletteButtons(); };
  document.getElementById('btnViewModeRoom').onclick = () => { state.viewColorMode = 2; updateViewPaletteButtons(); };

  document.getElementById('btnPause').onclick = e => {
    state.isPaused = !state.isPaused;
    e.currentTarget.textContent = state.isPaused ? '▶ Пуск' : '⏸ Пауза';
  };

  document.getElementById('btnSonar').onclick = e => {
    state.sonarEnabled = !state.sonarEnabled;
    e.currentTarget.classList.toggle('btn-active', state.sonarEnabled);
  };

  document.getElementById('btnBgMode').onclick = () => {
    state.showCameraBg = !state.showCameraBg;
    applyBgStyle();
  };

  document.getElementById('btnClearXR').onclick = clearPoints;
  document.getElementById('btnClearAll').onclick = clearPoints;

  document.getElementById('btnTopView').onclick = () => {
    state.yaw = 0; state.pitch = 1.52; state.zoom = 6.5;
  };
  document.getElementById('btnResetView').onclick = () => {
    state.yaw = 0.5; state.pitch = 0.45; state.zoom = 4.5;
  };

  document.getElementById('sliderRange').oninput = e => {
    state.maxRange = parseFloat(e.target.value);
    document.getElementById('rangeVal').textContent = state.maxRange.toFixed(1) + ' м';
  };

  document.getElementById('sliderClipY').oninput = e => {
    state.clipY = parseFloat(e.target.value);
    document.getElementById('clipYVal').textContent = state.clipY >= 3.45 ? 'Выкл' : (state.clipY.toFixed(1) + ' м');
  };
})();
</script>
</body>
</html>
