<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Тест LiDAR (Без камеры)</title>
<style>
  * { box-sizing: border-box; user-select: none; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #000; color: #0f0;
    font-family: ui-monospace, Menlo, monospace;
    overflow: hidden;
  }
  #hud {
    position: fixed; inset: 0; z-index: 10;
    display: flex; flex-direction: column; justify-content: space-between;
    padding: 16px; background: #000;
  }
  #canvas {
    position: fixed; inset: 0; width: 100%; height: 100%;
    z-index: 11; pointer-events: none;
  }
  .panel {
    position: relative; z-index: 12;
    background: rgba(0, 20, 0, 0.85);
    border: 1px solid #0f0; border-radius: 10px;
    padding: 12px; font-size: 13px; line-height: 1.5;
  }
  button {
    position: relative; z-index: 12;
    width: 100%; padding: 14px; border-radius: 12px;
    border: 1px solid #0f0; background: #030; color: #0f0;
    font-size: 15px; font-weight: bold; cursor: pointer;
  }
  .bad { color: #f44; }
  .ok { color: #0f0; }
</style>
</head>
<body>

<canvas id="canvas"></canvas>

<div id="hud">
  <div class="panel">
    <div><strong>ДИАГНОСТИКА LIDAR / WEBXR (БЕЗ КАМЕРЫ)</strong></div>
    <div>WebXR API: <span id="stXr">проверка...</span></div>
    <div>Depth API (Сырой LiDAR): <span id="stDepth">—</span></div>
    <div>Hit-Test (Попадания): <span id="stHits">0</span></div>
    <div>Дистанция до центра: <span id="stDist">— м</span></div>
    <div>Статус: <span id="stLog">Нажмите «Запустить тест»</span></div>
  </div>

  <button id="btnStart">▶ ЗАПУСТИТЬ ТЕСТ LIDAR</button>
</div>

<script>
const stXr = document.getElementById('stXr');
const stDepth = document.getElementById('stDepth');
const stHits = document.getElementById('stHits');
const stDist = document.getElementById('stDist');
const stLog = document.getElementById('stLog');
const btnStart = document.getElementById('btnStart');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

let session = null;
let refSpace = null;
let hitSource = null;
let hitCount = 0;
let gl = null;

if (navigator.xr) {
  stXr.textContent = 'ЕСТЬ';
  stXr.className = 'ok';
} else {
  stXr.textContent = 'НЕТ (Откройте в XRViewer)';
  stXr.className = 'bad';
}

btnStart.onclick = async () => {
  if (session) {
    await session.end();
    return;
  }
  if (!navigator.xr) {
    stLog.textContent = 'WebXR недоступен в этом браузере';
    return;
  }

  stLog.textContent = 'Запрос immersive-ar...';
  try {
    try {
      session = await navigator.xr.requestSession('immersive-ar', {
        optionalFeatures: ['hit-test', 'depth-sensing', 'dom-overlay'],
        domOverlay: { root: document.getElementById('hud') }
      });
    } catch {
      session = await navigator.xr.requestSession('immersive-ar', {
        optionalFeatures: ['hit-test']
      });
    }

    const glCanvas = document.createElement('canvas');
    gl = glCanvas.getContext('webgl', { xrCompatible: true });
    if (typeof XRWebGLLayer !== 'undefined') {
      session.updateRenderState({ baseLayer: new XRWebGLLayer(session, gl) });
    }

    refSpace = await session.requestReferenceSpace('local')
      .catch(() => session.requestReferenceSpace('viewer'));

    const viewerSpace = await session.requestReferenceSpace('viewer').catch(() => null);
    if (viewerSpace && session.requestHitTestSource) {
      hitSource = await session.requestHitTestSource({ space: viewerSpace }).catch(() => null);
    }

    btnStart.textContent = '■ ОСТАНОВИТЬ ТЕСТ';
    stLog.textContent = 'Сессия идет. Наведите на стену/предмет...';

    session.addEventListener('end', () => {
      session = null;
      hitSource = null;
      btnStart.textContent = '▶ ЗАПУСТИТЬ ТЕСТ LIDAR';
      stLog.textContent = 'Остановлено';
    });

    session.requestAnimationFrame(onFrame);
  } catch (e) {
    stLog.textContent = 'Ошибка: ' + e.message;
  }
};

function onFrame(time, frame) {
  if (!session) return;
  session.requestAnimationFrame(onFrame);

  if (gl && session.renderState.baseLayer) {
    gl.bindFramebuffer(gl.FRAMEBUFFER, session.renderState.baseLayer.framebuffer);
    gl.clearColor(0, 0, 0, 1);
    gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
  }

  const w = window.innerWidth, h = window.innerHeight;
  if (canvas.width !== w || canvas.height !== h) {
    canvas.width = w; canvas.height = h;
  }
  ctx.clearRect(0, 0, w, h);

  const pose = frame.getViewerPose(refSpace);
  if (!pose) {
    stLog.textContent = 'НЕТ ТРЕКИНГА (слишком темно для ARKit)';
    return;
  }

  stLog.textContent = 'Трекинг активен';
  const cam = pose.transform.position;
  const view = pose.views[0];

  if (frame.getDepthInformation && view) {
    try {
      const depth = frame.getDepthInformation(view);
      if (depth) {
        stDepth.textContent = 'РАБОТАЕТ (' + depth.width + 'x' + depth.height + ')';
        stDepth.className = 'ok';
      } else {
        stDepth.textContent = 'НЕТ ДАННЫХ';
        stDepth.className = 'bad';
      }
    } catch {
      stDepth.textContent = 'НЕ ПОДДЕРЖИВАЕТСЯ';
      stDepth.className = 'bad';
    }
  } else {
    stDepth.textContent = 'НЕТ В ЭТОМ БРАУЗЕРЕ';
    stDepth.className = 'bad';
  }

  if (hitSource) {
    const res = frame.getHitTestResults(hitSource);
    if (res.length > 0) {
      const p = res[0].getPose(refSpace).transform.position;
      const d = Math.hypot(p.x - cam.x, p.y - cam.y, p.z - cam.z);
      hitCount++;
      stHits.textContent = hitCount;
      stDist.textContent = d.toFixed(2) + ' м';
      drawCenterDot(w, h, d);
    }
  }

  if (typeof session.requestHitTest === 'function' && view) {
    const m = view.transform.matrix;
    const origin = new Float32Array([cam.x, cam.y, cam.z]);
    const dir = new Float32Array([-m[8], -m[9], -m[10]]);
    session.requestHitTest(origin, dir, refSpace).then(hits => {
      if (hits && hits.length > 0 && hits[0].hitMatrix) {
        const hm = hits[0].hitMatrix;
        const d = Math.hypot(hm[12] - cam.x, hm[13] - cam.y, hm[14] - cam.z);
        hitCount++;
        stHits.textContent = hitCount;
        stDist.textContent = d.toFixed(2) + ' м';
        drawCenterDot(w, h, d);
      }
    }).catch(() => {});
  }
}

function drawCenterDot(w, h, dist) {
  ctx.fillStyle = '#0f0';
  ctx.beginPath();
  ctx.arc(w / 2, h / 2, Math.max(6, 25 / dist), 0, Math.PI * 2);
  ctx.fill();
}
</script>
</body>
</html>
