<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>LiDAR Сканер Комнаты</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #000; color: #e2e8f0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
  }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }

  /* 3D Просмотрщик */
  #viewerScreen {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    background: #03060c; z-index: 5;
  }
  header {
    padding: 10px 12px; display: flex; justify-content: space-between; align-items: center; gap: 6px;
    background: rgba(8, 13, 24, 0.96); border-bottom: 1px solid rgba(34, 197, 94, 0.25);
  }
  .btn-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  button {
    border: 1px solid #334155; background: #111827; color: #f8fafc;
    border-radius: 10px; padding: 8px 11px; font-size: 12px; font-weight: 600;
    cursor: pointer; touch-action: manipulation;
  }
  button:active { transform: scale(0.96); opacity: 0.85; }
  .btn-green {
    background: rgba(16, 185, 129, 0.2); border-color: #10b981; color: #6ee7b7;
  }
  .btn-primary {
    background: #10b981; border-color: #34d399; color: #022c22; font-weight: 700;
  }
  .btn-active {
    background: rgba(34, 197, 94, 0.3) !important;
    border-color: #4ade80 !important; color: #fff !important;
  }

  #viewportWrap {
    position: relative; flex: 1; width: 100%; overflow: hidden; touch-action: none;
  }
  #view3DCanvas { width: 100%; height: 100%; display: block; }

  #emptyHint {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    pointer-events: none; color: #64748b; font-size: 14px; text-align: center; padding: 24px;
    line-height: 1.5;
  }

  footer {
    padding: 10px 12px; display: flex; justify-content: space-between; align-items: center; gap: 6px;
    background: rgba(8, 13, 24, 0.96); border-top: 1px solid rgba(34, 197, 94, 0.2);
  }

  /* Полноэкранный LiDAR Радар / Сканер комнаты */
  #xrOverlay {
    position: fixed; inset: 0; z-index: 100;
    display: none; flex-direction: column; justify-content: space-between;
    background: #000;
  }
  body.xr-active #viewerScreen { display: none; }
  body.xr-active #xrOverlay { display: flex; }

  #lidarCanvas {
    position: fixed; inset: 0; width: 100%; height: 100%;
    z-index: 101; pointer-events: none;
  }
  .xr-top {
    position: relative; z-index: 103; padding: 12px;
    display: flex; justify-content: space-between; align-items: flex-start; gap: 8px;
  }
  .xr-status-col {
    display: flex; flex-direction: column; gap: 6px;
  }
  #sensorPill {
    font-size: 11px; color: #86efac;
    background: rgba(0, 22, 8, 0.85); border: 1px solid rgba(74, 222, 128, 0.35);
    padding: 4px 8px; border-radius: 8px; align-self: flex-start;
  }

  /* 2D План комнаты сверху (мини-карта) */
  #miniMapCanvas {
    position: fixed; top: 64px; right: 12px; z-index: 103;
    width: 116px; height: 116px;
    background: rgba(0, 14, 6, 0.88);
    border: 1px solid rgba(74, 222, 128, 0.45);
    border-radius: 12px; pointer-events: none;
  }

  .xr-reticle {
    position: relative; z-index: 102; align-self: center; pointer-events: none;
    display: flex; flex-direction: column; align-items: center; gap: 6px;
  }
  .reticle-ring {
    width: 40px; height: 40px; border-radius: 50%;
    border: 1.5px solid rgba(74, 222, 128, 0.65);
    display: flex; align-items: center; justify-content: center;
  }
  .reticle-dot { width: 4px; height: 4px; border-radius: 50%; background: #4ade80; }
  #xrDist {
    font-size: 12px; font-weight: 700; color: #4ade80;
    background: rgba(0, 20, 0, 0.85); padding: 2px 8px; border-radius: 6px;
    border: 1px solid rgba(74, 222, 128, 0.35);
  }

  .xr-bottom {
    position: relative; z-index: 103; padding: 12px 12px 24px;
    background: linear-gradient(to top, rgba(0,0,0,0.96), rgba(0,0,0,0.6), transparent);
    display: flex; flex-direction: column; gap: 10px;
  }
  .range-row {
    display: flex; align-items: center; gap: 10px; font-size: 12px; color: #86efac;
  }
  input[type="range"] {
    flex: 1; height: 6px; border-radius: 99px; background: #14532d;
    outline: none; -webkit-appearance: none;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 20px; height: 20px;
    border-radius: 50%; background: #4ade80; cursor: pointer;
  }
  .xr-actions {
    display: flex; justify-content: space-between; align-items: center; gap: 6px;
  }
</style>
</head>
<body>

  <!-- 1. Экран 3D-просмотра комнаты и экспорта -->
  <div id="viewerScreen">
    <header>
      <div class="btn-row">
        <button type="button" id="btnStartScan" class="btn-primary">📡 Скан комнаты</button>
        <button type="button" id="btnStartRadar" class="btn-green">👁 ПНВ</button>
      </div>
      <div class="btn-row">
        <button type="button" id="btnTopView">🗺 План</button>
        <button type="button" id="btnResetView">🎯</button>
        <button type="button" id="btnClear">🗑</button>
      </div>
    </header>

    <div id="viewportWrap">
      <canvas id="view3DCanvas"></canvas>
      <div id="emptyHint">Нажмите «📡 Скан комнаты» или «👁 ПНВ»<br>Откройте в XRViewer</div>
    </div>

    <footer>
      <div class="btn-row">
        <button type="button" id="btnStylePts" class="btn-active">Точки</button>
        <button type="button" id="btnStyleMesh">Сетка</button>
      </div>
      <div class="btn-row">
        <button type="button" id="btnExportOBJ" class="mono">.OBJ</button>
        <button type="button" id="btnExportPLY" class="mono">.PLY</button>
      </div>
    </footer>
  </div>

  <!-- 2. Полноэкранный LiDAR Сканер / ПНВ (по умолчанию строго чёрный фон) -->
  <div id="xrOverlay">
    <canvas id="lidarCanvas"></canvas>
    <canvas id="miniMapCanvas" width="116" height="116"></canvas>

    <div class="xr-top">
      <div class="xr-status-col">
        <div class="btn-row">
          <button type="button" id="btnModeScan" class="btn-active">⏺ Скан</button>
          <button type="button" id="btnModeRadar">👁 ПНВ</button>
        </div>
        <div id="sensorPill" class="mono">Лучей: 0 | IMU: —</div>
      </div>
      <button type="button" id="btnExitXR" style="background:#7f1d1d; border-color:#ef4444;">Готово</button>
    </div>

    <div class="xr-reticle mono">
      <div class="reticle-ring"><div class="reticle-dot"></div></div>
      <div id="xrDist">— м</div>
    </div>

    <div class="xr-bottom mono">
      <div class="range-row">
        <span>Дальность:</span>
        <input type="range" id="sliderRange" min="0.5" max="8.0" step="0.5" value="5.0">
        <strong id="rangeVal" style="width:44px; text-align:right;">5.0 м</strong>
      </div>
      <div class="xr-actions">
        <button type="button" id="btnPauseRec">⏸ Пауза</button>
        <button type="button" id="btnClearXR">🗑 Сброс</button>
        <button type="button" id="btnToggleCamBg">📷 Фон: Чёрный</button>
      </div>
    </div>
  </div>

<script>
(function() {
  const state = {
    xrSession: null,
    xrMode: 'scan',      // 'scan' (комната) | 'radar' (живой ПНВ)
    isPaused: false,
    showCameraBg: false, // Строго чёрный фон по умолчанию
    maxRange: 5.0,
    // Живые точки для ПНВ
    radarPts: [],
    // Воксели комнаты (4 см ячейка)
    voxelMap: new Map(),
    scanCount: 0,
    // Датчики (Гироскоп + Акселерометр + Анти-скачок трекинга)
    imuActive: false,
    imuYaw: 0,
    imuPitch: 0,
    imuRoll: 0,
    imuAccelMag: 0,
    lastValidCam: null,
    trackingLost: false,
    activeRaysCount: 0,
    // 3D-просмотрщик
    viewStyle: 'points',
    yaw: 0.45,
    pitch: 0.4,
    zoom: 4.5
  };

  const MAX_SCAN = 50000;
  const sX = new Float32Array(MAX_SCAN);
  const sY = new Float32Array(MAX_SCAN);
  const sZ = new Float32Array(MAX_SCAN);
  const sR = new Uint8Array(MAX_SCAN);
  const sG = new Uint8Array(MAX_SCAN);
  const sB = new Uint8Array(MAX_SCAN);

  const lidarCanvas = document.getElementById('lidarCanvas');
  const lCtx = lidarCanvas.getContext('2d');
  const miniMap = document.getElementById('miniMapCanvas');
  const mCtx = miniMap.getContext('2d');
  const viewCanvas = document.getElementById('view3DCanvas');
  const vCtx = viewCanvas.getContext('2d');
  const xrDistEl = document.getElementById('xrDist');
  const sensorPill = document.getElementById('sensorPill');
  const emptyHint = document.getElementById('emptyHint');

  // Сетка 5x5 = 25 лучей по всему экрану (широкий веер для быстрого скана стен и пола)
  const rayGrid = [];
  for (let gy = -2; gy <= 2; gy++) {
    for (let gx = -2; gx <= 2; gx++) {
      const rx = gx * 0.22;
      const ry = gy * 0.28;
      const len = Math.hypot(rx, ry, -1);
      rayGrid.push({
        x: rx / len,
        y: ry / len,
        z: -1 / len,
        rawX: rx,
        rawY: ry,
        isCenter: (gx === 0 && gy === 0)
      });
    }
  }

  let gl = null;
  let refSpace = null;
  let hitSources = []; // Массив из 25 стандартных XRHitTestSource!
  let legacyRayIdx = 0;

  // =========================================================
  // 1. ПРИВЯЗКА ВСЕХ ДАТЧИКОВ IPHONE (ГИРОСКОП + АКСЕЛЕРОМЕТР)
  // =========================================================
  function onOrientation(e) {
    if (e.alpha === null && e.beta === null) return;
    state.imuActive = true;
    state.imuYaw = (e.alpha || 0) * Math.PI / 180;
    state.imuPitch = (e.beta || 0) * Math.PI / 180;
    state.imuRoll = (e.gamma || 0) * Math.PI / 180;
  }

  function onMotion(e) {
    const a = e.acceleration;
    if (a && a.x !== null) {
      state.imuAccelMag = Math.hypot(a.x, a.y, a.z);
      state.imuActive = true;
    }
  }

  async function initAllSensors() {
    try {
      if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
        const r1 = await DeviceOrientationEvent.requestPermission().catch(() => 'denied');
        if (r1 === 'granted') window.addEventListener('deviceorientation', onOrientation, true);
      } else {
        window.addEventListener('deviceorientation', onOrientation, true);
      }
      if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
        const r2 = await DeviceMotionEvent.requestPermission().catch(() => 'denied');
        if (r2 === 'granted') window.addEventListener('devicemotion', onMotion, true);
      } else {
        window.addEventListener('devicemotion', onMotion, true);
      }
    } catch (e) {}
  }

  // Цвет точки по высоте (пол = сине-голубой, стены = зелёный, верх/потолок = жёлто-оранжевый)
  function heightToRGB(y) {
    const t = Math.max(0, Math.min(1, (y + 1.4) / 2.8));
    if (t < 0.35) {
      const k = t / 0.35;
      return [20, Math.round(120 + k * 120), Math.round(230 - k * 50)];
    } else if (t < 0.72) {
      const k = (t - 0.35) / 0.37;
      return [Math.round(20 + k * 140), Math.round(240 - k * 15), Math.round(180 - k * 130)];
    } else {
      const k = (t - 0.72) / 0.28;
      return [Math.round(160 + k * 95), Math.round(225 - k * 95), Math.round(50 - k * 30)];
    }
  }

  const VOXEL = 0.04; // 4 см — оптимально для целой комнаты

  function registerHit(hx, hy, hz, dist, now) {
    if (dist < 0.15 || dist > state.maxRange) return;

    // 1. В живой ПНВ-буфер
    state.radarPts.push({ x: hx, y: hy, z: hz, d: dist, t: now });
    if (state.radarPts.length > 900) state.radarPts.shift();

    // 2. В 3D-карту комнаты (если не на паузе и режим Скан)
    if (state.xrMode === 'scan' && !state.isPaused && state.scanCount < MAX_SCAN) {
      const vx = Math.floor(hx / VOXEL);
      const vy = Math.floor(hy / VOXEL);
      const vz = Math.floor(hz / VOXEL);
      const key = vx + ',' + vy + ',' + vz;

      const cell = state.voxelMap.get(key);
      if (cell === undefined) {
        const id = state.scanCount++;
        state.voxelMap.set(key, id);
        const rgb = heightToRGB(hy);
        sX[id] = hx; sY[id] = hy; sZ[id] = hz;
        sR[id] = rgb[0]; sG[id] = rgb[1]; sB[id] = rgb[2];
      } else {
        // Плавное сглаживание координаты существующего вокселя
        sX[cell] = sX[cell] * 0.75 + hx * 0.25;
        sY[cell] = sY[cell] * 0.75 + hy * 0.25;
        sZ[cell] = sZ[cell] * 0.75 + hz * 0.25;
      }
    }
  }

  // =========================================================
  // 2. ЗАПУСК WEBXR LIDAR С 25 ЛУЧАМИ И СТРОГО ЧЁРНЫМ ФОНОМ
  // =========================================================
  async function startXR(mode) {
    if (!navigator.xr) {
      alert('WebXR не найден. Откройте файл в XRViewer.');
      return;
    }

    await initAllSensors();
    state.xrMode = mode;
    state.isPaused = false;
    state.lastValidCam = null;
    updateModeButtons();
    document.getElementById('btnPauseRec').textContent = '⏸ Пауза';

    try {
      let session;
      try {
        session = await navigator.xr.requestSession('immersive-ar', {
          optionalFeatures: ['hit-test', 'dom-overlay'],
          domOverlay: { root: document.getElementById('xrOverlay') }
        });
      } catch {
        session = await navigator.xr.requestSession('immersive-ar', {
          optionalFeatures: ['hit-test']
        });
      }

      state.xrSession = session;
      document.body.classList.add('xr-active');
      applyBgMode();

      const glCanvas = document.createElement('canvas');
      gl = glCanvas.getContext('webgl', { xrCompatible: true, alpha: true });
      if (typeof XRWebGLLayer !== 'undefined') {
        session.updateRenderState({ baseLayer: new XRWebGLLayer(session, gl) });
      }

      refSpace = await session.requestReferenceSpace('local')
        .catch(() => session.requestReferenceSpace('viewer'));

      const viewerSpace = await session.requestReferenceSpace('viewer').catch(() => null);

      // Создаем 25 независимых лучей Hit-Test по всему полю зрения!
      hitSources = [];
      if (viewerSpace && session.requestHitTestSource) {
        const hasXRRay = (typeof XRRay !== 'undefined');
        for (let i = 0; i < rayGrid.length; i++) {
          const r = rayGrid[i];
          try {
            let opts = { space: viewerSpace };
            if (hasXRRay && !r.isCenter) {
              opts.offsetRay = new XRRay(
                { x: 0, y: 0, z: 0, w: 1 },
                { x: r.x, y: r.y, z: r.z, w: 0 }
              );
            } else if (!hasXRRay && !r.isCenter) {
              continue;
            }
            const src = await session.requestHitTestSource(opts);
            hitSources.push({ src, isCenter: r.isCenter });
          } catch (e) {
            if (r.isCenter) {
              const src = await session.requestHitTestSource({ space: viewerSpace }).catch(() => null);
              if (src) hitSources.push({ src, isCenter: true });
            }
          }
        }
      }

      state.activeRaysCount = hitSources.length > 1 ? hitSources.length : (typeof session.requestHitTest === 'function' ? 25 : hitSources.length);

      session.addEventListener('end', () => {
        state.xrSession = null;
        hitSources = [];
        document.body.classList.remove('xr-active');
        document.documentElement.style.background = '#000';
        document.body.style.background = '#000';
        if (state.scanCount > 0) {
          centerScanPoints();
          emptyHint.style.display = 'none';
        }
      });

      session.requestAnimationFrame(onXRFrame);
    } catch (e) {
      alert('Ошибка запуска AR: ' + e.message);
    }
  }

  function onXRFrame(now, frame) {
    const session = state.xrSession;
    if (!session) return;
    session.requestAnimationFrame(onXRFrame);

    // 1. Заливаем WebGL слой строго чёрным (alpha = 1), если фон чёрный
    if (gl && session.renderState.baseLayer) {
      gl.bindFramebuffer(gl.FRAMEBUFFER, session.renderState.baseLayer.framebuffer);
      gl.clearColor(0, 0, 0, state.showCameraBg ? 0 : 1);
      gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
    }

    const pose = frame.getViewerPose(refSpace);
    if (!pose || !pose.views || pose.views.length === 0) {
      state.trackingLost = true;
      updateSensorStatus();
      renderBlackScreenOnly();
      return;
    }

    const cam = pose.transform.position;
    const view = pose.views[0];

    // Защита от резкого "телепорта" (сбоя трекинга в комнате) с учетом акселерометра
    let glitchJump = false;
    if (state.lastValidCam) {
      const stepDist = Math.hypot(cam.x - state.lastValidCam.x, cam.y - state.lastValidCam.y, cam.z - state.lastValidCam.z);
      // Если позиция прыгнула больше чем на 0.45 м за 1 кадр (16 мс) — это сбой трекинга, пропускаем запись
      if (stepDist > 0.45) {
        glitchJump = true;
      }
    }
    state.lastValidCam = { x: cam.x, y: cam.y, z: cam.z };
    state.trackingLost = glitchJump;
    updateSensorStatus();

    // Если не было сбоя — собираем лучи со всей сетки
    if (!glitchJump) {
      // A) Современный мульти-лучевой Hit-Test (все 25 лучей сразу за 1 кадр!)
      if (hitSources.length > 0) {
        for (let i = 0; i < hitSources.length; i++) {
          const item = hitSources[i];
          try {
            const res = frame.getHitTestResults(item.src);
            if (res.length > 0) {
              const hp = res[0].getPose(refSpace).transform.position;
              const d = Math.hypot(hp.x - cam.x, hp.y - cam.y, hp.z - cam.z);
              if (item.isCenter) xrDistEl.textContent = d.toFixed(2) + ' м';
              registerHit(hp.x, hp.y, hp.z, d, now);
            }
          } catch (e) {}
        }
      }

      // B) Резервный веер для старого API XRViewer (requestHitTest), если hitSources <= 1
      if (hitSources.length <= 1 && typeof session.requestHitTest === 'function') {
        const m = view.transform.matrix;
        const origin = new Float32Array([cam.x, cam.y, cam.z]);

        for (let k = 0; k < 5; k++) {
          const r = rayGrid[legacyRayIdx % rayGrid.length];
          legacyRayIdx++;
          const wx = m[0] * r.rawX + m[4] * r.rawY - m[8];
          const wy = m[1] * r.rawX + m[5] * r.rawY - m[9];
          const wz = m[2] * r.rawX + m[6] * r.rawY - m[10];
          const len = Math.hypot(wx, wy, wz) || 1;
          const dir = new Float32Array([wx / len, wy / len, wz / len]);

          session.requestHitTest(origin, dir, refSpace).then(hits => {
            if (hits && hits.length > 0 && hits[0].hitMatrix) {
              const hm = hits[0].hitMatrix;
              const hx = hm[12], hy = hm[13], hz = hm[14];
              const d = Math.hypot(hx - cam.x, hy - cam.y, hz - cam.z);
              if (r.isCenter) xrDistEl.textContent = d.toFixed(2) + ' м';
              registerHit(hx, hy, hz, d, performance.now());
            }
          }).catch(() => {});
        }
      }
    }

    renderLidarHUD(view.transform.inverse.matrix, view.projectionMatrix, now);
    renderMiniMap(cam, view.transform.matrix);
  }

  function updateSensorStatus() {
    const imuTxt = state.imuActive ? ('IMU OK ' + Math.round(state.imuYaw * 180 / Math.PI) + '°') : 'IMU —';
    const trkTxt = state.trackingLost ? ' | ⚠ Потеря трекинга' : '';
    sensorPill.textContent = 'Лучей: ' + state.activeRaysCount + ' | ' + imuTxt + trkTxt;
    sensorPill.style.color = state.trackingLost ? '#fb7185' : '#86efac';
  }

  function renderBlackScreenOnly() {
    const w = window.innerWidth, h = window.innerHeight;
    if (lidarCanvas.width !== w || lidarCanvas.height !== h) {
      lidarCanvas.width = w; lidarCanvas.height = h;
    }
    if (!state.showCameraBg) {
      lCtx.fillStyle = '#000';
      lCtx.fillRect(0, 0, w, h);
    } else {
      lCtx.clearRect(0, 0, w, h);
    }
  }

  function renderLidarHUD(viewMat, projMat, now) {
    const w = window.innerWidth, h = window.innerHeight;
    if (lidarCanvas.width !== w || lidarCanvas.height !== h) {
      lidarCanvas.width = w; lidarCanvas.height = h;
    }

    // ГАРАНТИРОВАННО ЧЁРНЫЙ ФОН: заливаем сам canvas чёрным, чтобы камера не просвечивала!
    if (!state.showCameraBg) {
      lCtx.fillStyle = '#000000';
      lCtx.fillRect(0, 0, w, h);
    } else {
      lCtx.clearRect(0, 0, w, h);
    }

    if (state.xrMode === 'radar') {
      const pts = state.radarPts;
      const screenPts = [];
      for (let i = 0; i < pts.length; i++) {
        const p = pts[i];
        const age = now - p.t;
        if (age > 4000) continue;

        const vx = viewMat[0] * p.x + viewMat[4] * p.y + viewMat[8] * p.z + viewMat[12];
        const vy = viewMat[1] * p.x + viewMat[5] * p.y + viewMat[9] * p.z + viewMat[13];
        const vz = viewMat[2] * p.x + viewMat[6] * p.y + viewMat[10] * p.z + viewMat[14];

        if (vz < -0.08) {
          const sx = ((projMat[0] * vx + projMat[8] * vz) / (-vz) * 0.5 + 0.5) * w;
          const sy = (1.0 - ((projMat[5] * vy + projMat[9] * vz) / (-vz) * 0.5 + 0.5)) * h;
          if (sx >= 0 && sx <= w && sy >= 0 && sy <= h) {
            const life = 1 - age / 4000;
            const near = Math.max(0.15, 1 - p.d / state.maxRange);
            screenPts.push({ sx, sy, d: p.d, life, near });
          }
        }
      }

      lCtx.lineWidth = 1;
      for (let i = 0; i < screenPts.length; i++) {
        const a = screenPts[i];
        for (let j = i + 1; j < Math.min(screenPts.length, i + 10); j++) {
          const b = screenPts[j];
          const ds = (a.sx - b.sx) * (a.sx - b.sx) + (a.sy - b.sy) * (a.sy - b.sy);
          if (ds < 5500 && Math.abs(a.d - b.d) < 0.25) {
            lCtx.strokeStyle = 'rgba(74, 222, 128,' + (a.life * a.near * 0.5).toFixed(2) + ')';
            lCtx.beginPath();
            lCtx.moveTo(a.sx, a.sy);
            lCtx.lineTo(b.sx, b.sy);
            lCtx.stroke();
          }
        }
        const sz = 2.5 + a.near * 4.5;
        const g = Math.round(115 + a.near * 140);
        lCtx.fillStyle = 'rgba(35,' + g + ',85,' + (a.life * 0.95).toFixed(2) + ')';
        lCtx.fillRect(a.sx - sz * 0.5, a.sy - sz * 0.5, sz, sz);
      }
    } else {
      // Режим скана комнаты: все накопленные точки (цвет по высоте)
      const n = state.scanCount;
      for (let i = 0; i < n; i++) {
        const vx = viewMat[0] * sX[i] + viewMat[4] * sY[i] + viewMat[8] * sZ[i] + viewMat[12];
        const vy = viewMat[1] * sX[i] + viewMat[5] * sY[i] + viewMat[9] * sZ[i] + viewMat[13];
        const vz = viewMat[2] * sX[i] + viewMat[6] * sY[i] + viewMat[10] * sZ[i] + viewMat[14];
        if (vz < -0.08) {
          const sx = ((projMat[0] * vx + projMat[8] * vz) / (-vz) * 0.5 + 0.5) * w;
          const sy = (1.0 - ((projMat[5] * vy + projMat[9] * vz) / (-vz) * 0.5 + 0.5)) * h;
          if (sx >= 0 && sx <= w && sy >= 0 && sy <= h) {
            lCtx.fillStyle = 'rgb(' + sR[i] + ',' + sG[i] + ',' + sB[i] + ')';
            lCtx.fillRect(sx - 2, sy - 2, 4, 4);
          }
        }
      }
    }
  }

  // Мини-карта комнаты (вид сверху X/Z) — сразу видно контур стен
  function renderMiniMap(cam, camMat) {
    const w = 116, h = 116, cx = 58, cy = 58;
    const scale = 12; // 1 метр = 12 пикселей (влезает ~9x9 м)
    mCtx.clearRect(0, 0, w, h);

    // Сетка 1м
    mCtx.strokeStyle = 'rgba(74, 222, 128, 0.14)';
    mCtx.lineWidth = 1;
    mCtx.beginPath();
    mCtx.moveTo(cx, 0); mCtx.lineTo(cx, h);
    mCtx.moveTo(0, cy); mCtx.lineTo(w, cy);
    mCtx.stroke();

    const step = state.scanCount > 4000 ? Math.floor(state.scanCount / 4000) : 1;
    for (let i = 0; i < state.scanCount; i += step) {
      const mx = cx + (sX[i] - cam.x) * scale;
      const mz = cy + (sZ[i] - cam.z) * scale;
      if (mx >= 0 && mx < w && mz >= 0 && mz < h) {
        mCtx.fillStyle = 'rgb(' + sR[i] + ',' + sG[i] + ',' + sB[i] + ')';
        mCtx.fillRect(mx, mz, 2, 2);
      }
    }

    // Стрелка направления взгляда телефона в центре карты
    const fx = -camMat[8], fz = -camMat[10];
    const fl = Math.hypot(fx, fz) || 1;
    mCtx.strokeStyle = '#fff';
    mCtx.lineWidth = 2;
    mCtx.beginPath();
    mCtx.moveTo(cx, cy);
    mCtx.lineTo(cx + (fx / fl) * 12, cy + (fz / fl) * 12);
    mCtx.stroke();

    mCtx.fillStyle = '#4ade80';
    mCtx.beginPath();
    mCtx.arc(cx, cy, 3, 0, Math.PI * 2);
    mCtx.fill();
  }

  function centerScanPoints() {
    const n = state.scanCount;
    if (n === 0) return;
    let cx = 0, cy = 0, cz = 0;
    for (let i = 0; i < n; i++) { cx += sX[i]; cy += sY[i]; cz += sZ[i]; }
    cx /= n; cy /= n; cz /= n;
    for (let i = 0; i < n; i++) { sX[i] -= cx; sY[i] -= cy; sZ[i] -= cz; }
  }

  // =========================================================
  // 3. 3D-ПРОСМОТРЩИК ОТСКАНИРОВАННОЙ КОМНАТЫ (ВРАЩЕНИЕ + ЗУМ)
  // =========================================================
  const pX = new Float32Array(MAX_SCAN);
  const pY = new Float32Array(MAX_SCAN);

  function renderViewer() {
    requestAnimationFrame(renderViewer);
    if (state.xrSession) return;

    const wrap = document.getElementById('viewportWrap');
    const w = wrap.clientWidth || 360, h = wrap.clientHeight || 500;
    if (viewCanvas.width !== w || viewCanvas.height !== h) {
      viewCanvas.width = w; viewCanvas.height = h;
    }

    vCtx.fillStyle = '#03060c';
    vCtx.fillRect(0, 0, w, h);

    const n = state.scanCount;
    if (n === 0) return;

    const cosY = Math.cos(state.yaw), sinY = Math.sin(state.yaw);
    const cosX = Math.cos(state.pitch), sinX = Math.sin(state.pitch);
    const fov = Math.min(w, h) * 0.85;

    for (let i = 0; i < n; i++) {
      const rx = sX[i] * cosY + sZ[i] * sinY;
      const rz = -sX[i] * sinY + sZ[i] * cosY;
      const ry = sY[i] * cosX - rz * sinX;
      const fz = sY[i] * sinX + rz * cosX + state.zoom;
      if (fz > 0.15) {
        pX[i] = w * 0.5 + (rx / fz) * fov;
        pY[i] = h * 0.5 - (ry / fz) * fov;
      } else {
        pX[i] = -9999;
      }
    }

    if (state.viewStyle === 'mesh') {
      vCtx.lineWidth = 0.7;
      for (let i = 1; i < n; i++) {
        if (pX[i] > -900 && pX[i - 1] > -900) {
          const dx = sX[i] - sX[i - 1], dy = sY[i] - sY[i - 1], dz = sZ[i] - sZ[i - 1];
          if (dx * dx + dy * dy + dz * dz < 0.015) {
            vCtx.strokeStyle = 'rgba(' + sR[i] + ',' + sG[i] + ',' + sB[i] + ',0.45)';
            vCtx.beginPath();
            vCtx.moveTo(pX[i - 1], pY[i - 1]);
            vCtx.lineTo(pX[i], pY[i]);
            vCtx.stroke();
          }
        }
      }
    }

    for (let i = 0; i < n; i++) {
      if (pX[i] >= 0 && pX[i] <= w && pY[i] >= 0 && pY[i] <= h) {
        vCtx.fillStyle = 'rgb(' + sR[i] + ',' + sG[i] + ',' + sB[i] + ')';
        vCtx.fillRect(pX[i] - 1.5, pY[i] - 1.5, 3, 3);
      }
    }
  }
  requestAnimationFrame(renderViewer);

  // Вращение 1 пальцем + Зум 2 пальцами
  const activePointers = new Map();
  let lastPinchDist = null;
  let lastSingle = null;
  const wrap = document.getElementById('viewportWrap');

  wrap.addEventListener('pointerdown', e => {
    activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (activePointers.size === 1) {
      lastSingle = { x: e.clientX, y: e.clientY };
      lastPinchDist = null;
    }
  });

  wrap.addEventListener('pointermove', e => {
    if (!activePointers.has(e.pointerId)) return;
    activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

    if (activePointers.size === 1 && lastSingle) {
      state.yaw += (e.clientX - lastSingle.x) * 0.008;
      state.pitch = Math.max(-1.55, Math.min(1.55, state.pitch + (e.clientY - lastSingle.y) * 0.008));
      lastSingle = { x: e.clientX, y: e.clientY };
    } else if (activePointers.size === 2) {
      const pts = Array.from(activePointers.values());
      const dist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
      if (lastPinchDist !== null) {
        state.zoom = Math.max(0.8, Math.min(14, state.zoom - (dist - lastPinchDist) * 0.015));
      }
      lastPinchDist = dist;
    }
  });

  function clearPointer(e) {
    activePointers.delete(e.pointerId);
    if (activePointers.size < 2) lastPinchDist = null;
    if (activePointers.size === 1) {
      const p = Array.from(activePointers.values())[0];
      lastSingle = { x: p.x, y: p.y };
    } else {
      lastSingle = null;
    }
  }
  wrap.addEventListener('pointerup', clearPointer);
  wrap.addEventListener('pointercancel', clearPointer);

  // Вспомогательные функции UI
  function updateModeButtons() {
    document.getElementById('btnModeScan').classList.toggle('btn-active', state.xrMode === 'scan');
    document.getElementById('btnModeRadar').classList.toggle('btn-active', state.xrMode === 'radar');
  }

  function applyBgMode() {
    const ov = document.getElementById('xrOverlay');
    const btn = document.getElementById('btnToggleCamBg');
    const bg = state.showCameraBg ? 'transparent' : '#000000';
    document.documentElement.style.background = bg;
    document.body.style.background = bg;
    ov.style.background = bg;
    btn.textContent = state.showCameraBg ? '📷 Фон: Камера' : '📷 Фон: Чёрный';
  }

  // Экспорт
  const NL = String.fromCharCode(10);
  function download(text, name) {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([text], { type: 'text/plain' }));
    a.download = name;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
  }

  document.getElementById('btnExportOBJ').onclick = () => {
    if (state.scanCount === 0) return;
    const lines = ['# LiDAR Room Scan'];
    for (let i = 0; i < state.scanCount; i++) {
      lines.push('v ' + sX[i].toFixed(4) + ' ' + sY[i].toFixed(4) + ' ' + sZ[i].toFixed(4) + ' ' + (sR[i]/255).toFixed(3) + ' ' + (sG[i]/255).toFixed(3) + ' ' + (sB[i]/255).toFixed(3));
    }
    download(lines.join(NL), 'room-scan-' + Date.now() + '.obj');
  };

  document.getElementById('btnExportPLY').onclick = () => {
    if (state.scanCount === 0) return;
    const lines = [
      'ply', 'format ascii 1.0', 'element vertex ' + state.scanCount,
      'property float x', 'property float y', 'property float z',
      'property uchar red', 'property uchar green', 'property uchar blue', 'end_header'
    ];
    for (let i = 0; i < state.scanCount; i++) {
      lines.push(sX[i].toFixed(4) + ' ' + sY[i].toFixed(4) + ' ' + sZ[i].toFixed(4) + ' ' + sR[i] + ' ' + sG[i] + ' ' + sB[i]);
    }
    download(lines.join(NL), 'room-cloud-' + Date.now() + '.ply');
  };

  // Кнопки
  document.getElementById('btnStartScan').onclick = () => startXR('scan');
  document.getElementById('btnStartRadar').onclick = () => startXR('radar');
  document.getElementById('btnModeScan').onclick = () => { state.xrMode = 'scan'; updateModeButtons(); };
  document.getElementById('btnModeRadar').onclick = () => { state.xrMode = 'radar'; updateModeButtons(); };
  document.getElementById('btnExitXR').onclick = () => { if (state.xrSession) state.xrSession.end(); };

  document.getElementById('btnPauseRec').onclick = e => {
    state.isPaused = !state.isPaused;
    e.currentTarget.textContent = state.isPaused ? '▶ Пуск' : '⏸ Пауза';
  };

  document.getElementById('btnToggleCamBg').onclick = () => {
    state.showCameraBg = !state.showCameraBg;
    applyBgMode();
  };

  document.getElementById('btnClearXR').onclick = () => {
    state.radarPts = [];
    state.voxelMap.clear();
    state.scanCount = 0;
  };

  document.getElementById('btnClear').onclick = () => {
    state.radarPts = [];
    state.voxelMap.clear();
    state.scanCount = 0;
    emptyHint.style.display = 'flex';
  };

  document.getElementById('btnTopView').onclick = () => {
    state.yaw = 0; state.pitch = 1.54; state.zoom = 6.5;
  };

  document.getElementById('btnResetView').onclick = () => {
    state.yaw = 0.45; state.pitch = 0.4; state.zoom = 4.5;
  };

  document.getElementById('btnStylePts').onclick = () => {
    state.viewStyle = 'points';
    document.getElementById('btnStylePts').classList.add('btn-active');
    document.getElementById('btnStyleMesh').classList.remove('btn-active');
  };

  document.getElementById('btnStyleMesh').onclick = () => {
    state.viewStyle = 'mesh';
    document.getElementById('btnStyleMesh').classList.add('btn-active');
    document.getElementById('btnStylePts').classList.remove('btn-active');
  };

  document.getElementById('sliderRange').oninput = e => {
    state.maxRange = parseFloat(e.target.value);
    document.getElementById('rangeVal').textContent = state.maxRange.toFixed(1) + ' м';
  };
})();
</script>
</body>
</html>
